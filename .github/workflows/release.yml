name: Release

# Push a tag like "v1.0" (or "v1.1") to build, test and publish DiskTrim.exe as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0 (manual runs upload an artifact only, no release)'
        required: true
        default: '1.0'

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ github.event.inputs.version }}' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building DiskTrim $v"

      - name: Test
        run: dotnet test DiskTrim.slnx -c Release

      - name: Build package (single-file exe + installer)
        shell: pwsh
        run: ./installer/Build-Package.ps1 -Version ${{ steps.version.outputs.version }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskTrim-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/DiskTrim-Setup-*.exe
            artifacts/DiskTrim-*.zip
            artifacts/DiskTrim-*.zip.sha256

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: DiskTrim ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/DiskTrim-Setup-*.exe
            artifacts/DiskTrim-*.zip
            artifacts/DiskTrim-*.zip.sha256
